[project]
name = "app"
version = "0.1.0"
description = "Production-grade FastAPI backend foundation"
readme = "README.md"
requires-python = ">=3.13,<3.15"

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "structlog==26.1.0",
    "orjson==3.12.0",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "pyjwt==2.14.0",
    "pwdlib[argon2]==0.3.1",
    "python-multipart==0.0.32",
    "prometheus-client==0.26.0",
    "redis==8.1.0",
    "anyio==4.15.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "pre-commit==4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

# ---------------------------------------------------------------- ruff ------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # no print()
    "SIM",       # simplify
    "TID",       # tidy imports
    "RUF",       # ruff-specific
    "ASYNC",     # async correctness
    "S",         # bandit security
    "PT",        # pytest style
    "ANN",       # annotations
]
ignore = [
    "ANN401",  # allow Any where genuinely needed
    "B008",    # FastAPI Depends() in defaults is the idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN201", "ANN001"]   # asserts and loose annotations are fine in tests
"migrations/**" = ["ANN", "E501", "S"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# ---------------------------------------------------------------- mypy ------
[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_untyped_decorators = false   # FastAPI/pytest decorators are untyped upstream
mypy_path = "src"

[[tool.mypy.overrides]]
# Tests are strict about the code they exercise, not about their own signatures:
# annotating every `def test_x() -> None` adds noise without catching anything.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false

# --------------------------------------------------------------- pytest -----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: tests that require a live database",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
