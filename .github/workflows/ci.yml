name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.23"
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Type check
        run: uv run mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key-not-used-anywhere-else-0123456789
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
      TEST_DATABASE_NAME: app_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Run tests
        run: uv run pytest --cov --cov-report=xml
      - name: Verify migrations match the models
        # Catches the classic mistake: a model changed, no migration generated.
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Verify migrations are reversible
        run: uv run alembic downgrade base && uv run alembic upgrade head

  build:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pet-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
